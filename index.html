<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Sales | Webex Chili Piper Demo</title>
<style>
  /* ---------- Tokens (values taken from the live page's computed styles) ---------- */
  :root {
    /* Their brand font (CiscoSansTT) isn't public; Helvetica is their own fallback */
    --font: "CiscoSansTT", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --page-bg: rgb(24, 24, 24);
    --ink: rgb(24, 24, 24);
    --muted: rgb(129, 129, 129);
    --green: rgb(7, 136, 85);
    --green-hover: rgb(5, 110, 69);
    --rule: rgb(79, 79, 79);
    --field-border: rgb(196, 196, 196);
    --gutter: 64px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--page-bg); color: #fff; font-family: var(--font); font-size: 14px; line-height: 1.4; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  .site-header { height: 73px; display: flex; align-items: center; padding: 0 var(--gutter); border-bottom: 1px solid var(--rule); }
  /* Text wordmark placeholder: swap in the prospect's logo file */
  .brand { display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.04em; color: #fff; }
  .brand__mark { width: 30px; height: 22px; border-radius: 11px; background: linear-gradient(90deg, #00a0d1 0%, #5b5be6 50%, #13c58f 100%); }

  /* ---------- Layout ---------- */
  .contact { display: grid; grid-template-columns: 424px 1fr; column-gap: 131px; align-items: start; padding: 60px var(--gutter) 80px; }

  /* ---------- Left column ---------- */
  .contact__heading { margin: 0 0 20px; font-size: 48px; font-weight: 400; line-height: 50px; letter-spacing: -0.04em; color: #fff; }
  .contact__lede { margin: 0 0 50px; font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: -0.02em; color: var(--muted); }
  .contact__block-title { margin: 0 0 12px; font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: -0.02em; color: #fff; }
  .contact__block-title a { color: var(--green); font-weight: 600; }
  .contact__link { margin: 0 0 20px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); font-size: 15px; font-weight: 500; line-height: 15px; }
  .contact__link a { color: var(--green); letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 6px; }
  .contact__link a:hover, .contact__block-title a:hover { text-decoration: underline; }
  .contact__link svg { width: 12px; height: 12px; }

  /* ---------- Form card ---------- */
  .form-card { background: #fff; color: var(--ink); border-radius: 20px; padding: 40px; box-shadow: rgba(0, 0, 0, .05) 0 4px 30px 0; max-width: 757px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; column-gap: 39px; row-gap: 20px; }
  .field { display: flex; flex-direction: column; min-width: 0; }
  .field--full { grid-column: 1 / -1; }
  .label { margin-bottom: 10px; font-size: 15px; line-height: 20px; color: #000; }
  .input {
    width: 100%; height: 55px; padding: 0 26px; border: 1px solid var(--field-border); border-radius: 30px;
    background: transparent; color: var(--ink); font: 400 16px/24px var(--font); outline: none;
    transition: border-color .15s;
  }
  .input:hover { border-color: rgb(140, 140, 140); }
  .input:focus { border-color: var(--ink); }
  .form :user-invalid { border-color: rgb(207, 33, 33); }
  select.input {
    appearance: none; -webkit-appearance: none; cursor: pointer; font-size: 15px; letter-spacing: -0.01em; padding-right: 50px;
    background: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath d='M1 1.5l5 5 5-5' fill='none' stroke='%23181818' stroke-width='1.3'/%3e%3c/svg%3e") no-repeat right 22px center;
  }

  /* Multi-select dropdown (keeps a real <select multiple name="multi-select"> underneath) */
  .ms { position: relative; }
  .ms__native { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .ms__toggle { text-align: left; cursor: pointer; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 50px;
    background: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath d='M1 1.5l5 5 5-5' fill='none' stroke='%23181818' stroke-width='1.3'/%3e%3c/svg%3e") no-repeat right 22px center; }
  .ms__toggle[aria-expanded="true"] { border-color: var(--ink); }
  .ms__panel { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--field-border); border-radius: 20px;
    padding: 10px 0; box-shadow: 0 8px 30px rgba(0,0,0,.12); display: none; }
  .ms__panel.open { display: block; }
  .ms__opt { display: flex; align-items: center; gap: 12px; padding: 9px 26px; font-size: 15px; cursor: pointer; }
  .ms__opt:hover { background: rgb(245, 245, 245); }
  .ms__opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }

  /* Consent checkbox */
  .consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; font-size: 12px; line-height: 16px; letter-spacing: -0.01em; cursor: pointer; }
  .consent input { appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin: 0; border: 1px solid var(--ink); border-radius: 3px; background: #fff; cursor: pointer; display: grid; place-content: center; }
  .consent input:checked { background: var(--ink); }
  .consent input:checked::after { content: ""; width: 8px; height: 4px; border: solid #fff; border-width: 0 0 1.5px 1.5px; transform: translateY(-1px) rotate(-45deg); }
  .consent p { margin: 0; }
  .consent p + p { margin-top: 16px; }

  .submit {
    grid-column: 1 / -1; margin-top: 18px; height: 56px; border: 1px solid var(--green); border-radius: 50px;
    background: var(--green); color: #fff; font: 500 15px/14px var(--font); letter-spacing: -0.02em; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background-color .15s;
  }
  .submit:hover { background: var(--green-hover); border-color: var(--green-hover); }
  .submit svg { width: 12px; height: 12px; }

  /* ---------- Footer ---------- */
  .site-footer { padding: 40px var(--gutter) 30px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .socials { display: flex; gap: 20px; margin-bottom: 26px; }
  .socials a { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid #fff; display: grid; place-content: center; font-size: 11px; font-weight: 700; }
  .copyright { margin: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
  .legal { display: flex; gap: 20px; font-size: 12px; line-height: 16px; }
  .legal a:hover { text-decoration: underline; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) { .contact { grid-template-columns: 1fr; row-gap: 40px; } .form-card { max-width: none; } }
  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    .contact__heading { font-size: 36px; line-height: 40px; }
    .form-card { padding: 24px; }
    .form { grid-template-columns: 1fr; }
  }
</style>

<script>
  // Multi-select: build checkbox options from the real <select multiple> and keep them in sync.
  (function () {
    const native = document.getElementById('multi-select');
    const toggle = document.querySelector('.ms__toggle');
    const panel = document.querySelector('.ms__panel');
    [...native.options].forEach((opt, i) => {
      const row = document.createElement('label');
      row.className = 'ms__opt';
      row.innerHTML = '<input type="checkbox"><span></span>';
      row.querySelector('span').textContent = opt.text;
      row.querySelector('input').addEventListener('change', (e) => { opt.selected = e.target.checked; render(); });
      panel.appendChild(row);
    });
    function render() {
      const picked = [...native.selectedOptions].map(o => o.text);
      toggle.textContent = picked.join(', ');
    }
    toggle.addEventListener('click', () => {
      const open = panel.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.ms')) { panel.classList.remove('open'); toggle.setAttribute('aria-expanded', 'false'); }
    });
    render();
  })();

  // Fill tracking fields from the page URL, the way the live form does.
  (function () {
    const p = new URLSearchParams(location.search);
    document.getElementById('clickedurl').value = location.href;
    document.getElementById('utm_campaign').value = p.get('utm_campaign') || '';
    ['medium', 'source', 'content', 'term'].forEach(k => { document.getElementById(k).value = p.get('utm_' + k) || ''; });
  })();

  // Stop the page reloading; Concierge (below) listens for this submit and opens the scheduler.
  const form = document.getElementById('contactsalesutmrouting');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    console.log('Form data:', Object.fromEntries(new FormData(form)));
  });
</script>
